name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/haier-tv-voice]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Restore Android source tree
        shell: bash
        run: |
          cat sources/part{1..7}.b64 | base64 --decode > source.tar.xz
          echo "90514d13dae0a91e94ab00f5a32f8f657608d91988e0a6bfaadea90706dd7859  source.tar.xz" | sha256sum --check
          tar -xJf source.tar.xz
          test -f app/src/main/AndroidManifest.xml

      - name: Enable ChatGPT Voice accessibility integration
        run: python3 patches/apply.py

      - name: Add lock-screen unlock relay
        run: python3 patches/v04/apply.py

      - name: Enable persistent background wake-word listening
        run: python3 patches/v05/apply.py

      - name: Enable offline TV commands
        run: python3 patches/v06/apply.py

      - name: Add delivery feedback and update version
        run: python3 patches/v07/apply.py

      - name: Route ChatGPT and TV wake phrases
        run: python3 patches/v08/apply.py

      - name: Add screen-off haptic acknowledgement
        run: python3 patches/v09/apply.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate compilation without signing
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Restore permanent signing key from repository secret
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PRIVETCHAT_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Set repository Actions secret PRIVETCHAT_SIGNING_KEYSTORE_B64 first. See SIGNING.md"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Stable signing key available. Never print or upload it."

      - name: Build Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivetChat-Assistant-v0.9-haptic-feedback-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
